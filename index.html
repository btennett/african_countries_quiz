<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}
[hidden]{display:none!important}
:root{
  --bg:#ECEFEA; --surface:#FFFFFF; --ink:#18201B; --muted:#5C665F; --line:#D2D9D2;
  --accent:#1F4E8C; --good:#1D7448; --bad:#B0281F; --good-soft:#E2F1E8; --bad-soft:#FAE6E3;
  --sea:#DCE6EE; --land:#FBFBF7; --land-hover:#E6ECF5; --border:#8C978F; --ctx:#E4E7E1; --sel:#1F4E8C;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-head:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#1A221D; --ink:#E5ECE6; --muted:#98A49B; --line:#2C3830;
  --accent:#8DB4F0; --good:#4CC48A; --bad:#F27C70; --good-soft:#163024; --bad-soft:#3A1E1C;
  --sea:#0E1A22; --land:#26302A; --land-hover:#2F3D4E; --border:#6B786F; --ctx:#1A201C; --sel:#5E93E0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1A221D; --ink:#E5ECE6; --muted:#98A49B; --line:#2C3830;
  --accent:#8DB4F0; --good:#4CC48A; --bad:#F27C70; --good-soft:#163024; --bad-soft:#3A1E1C;
  --sea:#0E1A22; --land:#26302A; --land-hover:#2F3D4E; --border:#6B786F; --ctx:#1A201C; --sel:#5E93E0; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.app{height:100%;max-width:640px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{padding-block:14px 8px;display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:-.01em;margin:0}
.brand em{font-style:normal;color:var(--accent)}
.score{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.score b{color:var(--ink);font-size:1rem}
.dots{display:grid;gap:5px;list-style:none;margin:0;padding:0}
.dots li{height:6px;border-radius:3px;background:var(--line)}
.dots li.now{background:var(--accent)} .dots li.ok{background:var(--good)} .dots li.no{background:var(--bad)}

.stage{min-height:0;display:flex;flex-direction:column;gap:8px;padding-block:2px 10px}
.qrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.question{font-family:var(--f-head);font-weight:600;font-size:clamp(1.25rem,5.4vw,1.6rem);line-height:1.2;margin:0}
.question b{color:var(--accent);font-weight:600}
.meta{font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);white-space:nowrap}

.mapbox{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;background:var(--sea);border:1px solid var(--line)}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.ctx{fill:var(--ctx);stroke:var(--border);stroke-opacity:.35;stroke-width:.6;vector-effect:non-scaling-stroke;pointer-events:none}
.c{fill:var(--land);stroke:var(--border);stroke-width:.8;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer;transition:fill .12s}
@media (hover:hover){.c:hover{fill:var(--land-hover)}}
.c.sel{fill:var(--sel)}
.c.ok{fill:var(--good)} .c.no{fill:var(--bad)}
.c.dim{fill:var(--land);opacity:.55}
.mk{fill:transparent;stroke:var(--border);stroke-dasharray:3 3;stroke-width:1.2;vector-effect:non-scaling-stroke;cursor:pointer}
.mk.sel{stroke:var(--sel);stroke-width:2.4;stroke-dasharray:none;fill:color-mix(in srgb,var(--sel) 22%,transparent)}
.mk.ok{stroke:var(--good);stroke-width:2.4;stroke-dasharray:none;fill:color-mix(in srgb,var(--good) 22%,transparent)}
.mk.no{stroke:var(--bad);stroke-width:2.4;stroke-dasharray:none;fill:color-mix(in srgb,var(--bad) 22%,transparent)}
.ring{fill:none;stroke:var(--good);stroke-width:2.5;vector-effect:non-scaling-stroke;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.ring{animation:pulse 1.4s ease-out 3}@keyframes pulse{0%{stroke-opacity:1}100%{stroke-opacity:0}}}
.lbl{font-family:var(--f-display);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-linejoin:round;pointer-events:none;text-anchor:middle}
.lbl.no{fill:var(--bad)} .lbl.ok{fill:var(--good)}

.zoom{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:1.15rem;cursor:pointer;display:grid;place-items:center;box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.zoom button:active{transform:scale(.95)}
.hint{position:absolute;left:10px;bottom:8px;font-family:var(--f-mono);font-size:.66rem;color:var(--muted);pointer-events:none}

.fact{position:absolute;left:8px;right:8px;bottom:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 16px rgb(0 0 0 / .14)}
.fact .verdict{font-weight:800;font-size:1.02rem;margin:0}
.fact .verdict.ok{color:var(--good)} .fact .verdict.no{color:var(--bad)}
.fact p{margin:0;font-family:var(--f-head);font-size:.95rem;line-height:1.45}
@media (prefers-reduced-motion:no-preference){.fact{animation:rise .25s ease-out}@keyframes rise{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}}

.over{display:flex;flex-direction:column;gap:16px;overflow-y:auto;min-height:0;padding-block:6px 14px}
.final{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:6px}
.final .big{font-weight:800;font-size:3.2rem;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:0}
.final p{margin:0}
.final .best{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.review-title{font-size:.8rem;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 0 0;font-weight:500}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.review li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.review .mark{font-weight:800;font-size:1.05rem;line-height:1.3}
.review .mark.ok{color:var(--good)} .review .mark.no{color:var(--bad)}
.review .q{font-family:var(--f-head);font-size:.95rem;line-height:1.35}
.review .ans{grid-column:2;font-size:.85rem;color:var(--muted)}
.review .ans b{color:var(--ink);font-weight:600}

.actions{padding-block:10px 14px;border-top:1px solid var(--line);background:var(--bg)}
.btn{width:100%;border:none;border-radius:12px;min-height:58px;font-weight:700;font-size:1.1rem;cursor:pointer;
  background:var(--accent);color:var(--surface);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn[disabled]{background:var(--line);color:var(--muted);cursor:default;transform:none}
.foot{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);text-align:center;margin:8px 0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<script>
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const shuffle = a => { a = [...a]; for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

const DATA = JSON.parse($("quiz-data").textContent);
const GEO = JSON.parse($("geo-data").textContent);
const PER = Math.max(1, +DATA.settings.questionsPerGame || 12);
const COUNTRIES = DATA.countries.filter(c => GEO.countries[c.id]);
const BY_ID = Object.fromEntries(COUNTRIES.map(c => [c.id, c]));
const SMALL = 60; // countries with smaller projected area get a dashed tap circle

// ---------- Build the map ----------
const svg = $("map");
svg.setAttribute("viewBox", GEO.vb.join(" "));
svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
const g = document.createElementNS(NS, "g"); svg.appendChild(g);
const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
GEO.context.forEach(d => mk("path", { d, class: "ctx" }, g));
const paths = {}, markers = {};
for (const id in GEO.countries) mk("path", { d: GEO.countries[id].d, class: "c", "data-id": id }, g), paths[id] = g.lastChild;
const mkLayer = mk("g", {}, g), fxLayer = mk("g", {}, g);
for (const id in GEO.countries) if (GEO.countries[id].a < SMALL)
  markers[id] = mk("circle", { cx: GEO.countries[id].c[0], cy: GEO.countries[id].c[1], class: "mk", "data-id": id }, mkLayer);

// Zoom & pan (d3-zoom handles pinch, drag, wheel, double-tap)
let K = 1;
const pxToUnits = () => Math.max(GEO.vb[2] / svg.clientWidth, GEO.vb[3] / svg.clientHeight);
function rescale() { // keep markers, rings and labels a constant size on screen
  const u = pxToUnits() / K;
  for (const id in markers) markers[id].setAttribute("r", 13 * u);
  fxLayer.querySelectorAll(".ring").forEach(r => r.setAttribute("r", 18 * u));
  fxLayer.querySelectorAll(".lbl").forEach(t => { t.setAttribute("font-size", 14 * u); t.setAttribute("stroke-width", 3.5 * u); t.setAttribute("y", +t.dataset.y - (t.dataset.off ? 22 * u : 0)); });
}
const zoom = D3.zoom().scaleExtent([1, 14]).extent([[GEO.vb[0], GEO.vb[1]], [GEO.vb[0] + GEO.vb[2], GEO.vb[1] + GEO.vb[3]]])
  .translateExtent([[GEO.vb[0] - 150, GEO.vb[1] - 150], [GEO.vb[0] + GEO.vb[2] + 150, GEO.vb[1] + GEO.vb[3] + 150]])
  .on("zoom", e => { g.setAttribute("transform", e.transform); K = e.transform.k; rescale(); });
const sel = D3.select(svg).call(zoom);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ease = s => reduce ? s : s.transition().duration(650);
$("zin").onclick = () => ease(sel).call(zoom.scaleBy, 1.8);
$("zout").onclick = () => ease(sel).call(zoom.scaleBy, 1 / 1.8);
$("zfit").onclick = () => ease(sel).call(zoom.transform, D3.zoomIdentity);
function zoomTo(ids) { // fit the given countries in view
  let [x0, y0, x1, y1] = [1e9, 1e9, -1e9, -1e9];
  ids.forEach(id => { const b = GEO.countries[id].b; x0 = Math.min(x0, b[0]); y0 = Math.min(y0, b[1]); x1 = Math.max(x1, b[2]); y1 = Math.max(y1, b[3]); });
  const w = Math.max(x1 - x0, 140), h = Math.max(y1 - y0, 140);
  const k = Math.min(8, 0.6 / Math.max(w / GEO.vb[2], h / GEO.vb[3]));
  const t = D3.zoomIdentity.translate(GEO.vb[0] + GEO.vb[2] / 2, GEO.vb[1] + GEO.vb[3] / 2).scale(Math.max(1, k)).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
  ease(sel).call(zoom.transform, t);
}
window.addEventListener("resize", rescale);

// ---------- Game ----------
let round = [], i = 0, score = 0, answers = [], picked = null, answered = false;
const total = () => round.length;

function setClass(id, cls) {
  paths[id].setAttribute("class", "c" + (cls ? " " + cls : ""));
  if (markers[id]) markers[id].setAttribute("class", "mk" + (cls ? " " + cls : ""));
}
function clearMap() {
  for (const id in paths) setClass(id, "");
  fxLayer.innerHTML = "";
}
function label(id, text, cls, offset) {
  const [x, y] = GEO.countries[id].c;
  mk("text", { x, y, "data-y": y, "data-off": offset ? 1 : "", class: "lbl " + cls }, fxLayer).textContent = text;
}

function header() {
  const done = !$("over").hidden;
  $("scoreBox").innerHTML = done ? `Done · Score <b>${score}</b>` : `Q <b>${Math.min(i + 1, total())}</b>/${total()} · Score <b>${score}</b>`;
  $("dots").style.gridTemplateColumns = `repeat(${total()},1fr)`;
  $("dots").innerHTML = round.map((_, k) => `<li class="${k < answers.length ? (answers[k].ok ? "ok" : "no") : (k === i && !done ? "now" : "")}"></li>`).join("");
}

function show() {
  const x = round[i];
  picked = null; answered = false;
  clearMap();
  $("question").innerHTML = `Where is <b>${esc(x.country)}</b>?`;
  $("cat").textContent = x.region;
  $("fact").hidden = true; $("hint").hidden = false;
  const b = $("mainBtn"); b.disabled = true; b.textContent = "Tap a country";
  ease(sel).call(zoom.transform, D3.zoomIdentity);
  header();
}

function pick(id) {
  if (answered || !BY_ID[id]) return;
  if (picked) setClass(picked, "");
  picked = id; setClass(id, "sel");
  buzz(8);
  const b = $("mainBtn"); b.disabled = false; b.textContent = "Confirm ✓";
}

function confirmPick() {
  answered = true;
  const x = round[i], ok = picked === x.id;
  if (ok) score++;
  answers.push({ x, picked, ok });
  buzz(ok ? 20 : [30, 40, 30]);
  for (const id in paths) setClass(id, id === x.id ? "ok" : id === picked ? "no" : "dim");
  const [cx, cy] = GEO.countries[x.id].c;
  mk("circle", { cx, cy, class: "ring" }, fxLayer);
  if (!ok) label(picked, BY_ID[picked].country, "no", false);
  label(x.id, x.country, "ok", true);
  rescale();
  zoomTo(ok ? [x.id] : [x.id, picked]);

  $("verdict").textContent = ok ? `Correct! That's ${x.country}.` : `Not quite. You picked ${BY_ID[picked].country}.`;
  $("verdict").className = "verdict " + (ok ? "ok" : "no");
  $("factText").textContent = `Capital: ${x.capital}.` + (x.fact ? " " + x.fact : "");
  $("fact").hidden = false; $("hint").hidden = true;
  $("live").textContent = $("verdict").textContent;
  const b = $("mainBtn"); b.textContent = i === total() - 1 ? "See your results →" : "Next question →";
  header();
}

function finish() {
  $("play").hidden = true; $("over").hidden = false;
  const n = total(), pct = score / n;
  $("finalScore").textContent = `${score}/${n}`;
  $("finalMsg").textContent = pct >= .9 ? "Outstanding. You know your way around Africa." : pct >= .7 ? "Great result. A seasoned traveller." : pct >= .5 ? "Solid effort. Have another go." : "A tough set. Every round is different, so try again.";
  let best = score;
  try { const key = "africa-map-best-" + DATA.version; best = Math.max(score, +(localStorage.getItem(key) || 0)); localStorage.setItem(key, best); } catch (e) {}
  $("best").textContent = `Best score on this device: ${best}/${n}`;
  $("review").innerHTML = answers.map(a => `<li><span class="mark ${a.ok ? "ok" : "no"}">${a.ok ? "✓" : "✗"}</span><span class="q">Where is ${esc(a.x.country)}?</span>
    <span class="ans">${a.ok ? `<b>Found it</b>` : `You picked <b>${esc(BY_ID[a.picked].country)}</b>`}</span></li>`).join("");
  const b = $("mainBtn"); b.disabled = false; b.textContent = "Play again ↻";
  header();
}

function start() {
  round = shuffle(COUNTRIES).slice(0, Math.min(PER, COUNTRIES.length));
  i = 0; score = 0; answers = [];
  $("over").hidden = true; $("play").hidden = false;
  show();
}

svg.addEventListener("click", e => { const t = e.target.closest("[data-id]"); if (t) pick(t.dataset.id); });
$("mainBtn").addEventListener("click", () => {
  if (!$("over").hidden) return start();
  if (!answered && picked) return confirmPick();
  if (answered) { if (i < total() - 1) { i++; show(); } else finish(); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && !$("mainBtn").disabled && document.activeElement !== $("mainBtn")) { e.preventDefault(); $("mainBtn").click(); } });

$("foot").textContent = `${COUNTRIES.length} countries · v${DATA.version}`;
start();
</script>
</body>
